include:
  - project: devsecops/gitlab-ci-common
    ref: master
    file: /template/artifactory_token_service.yml

before_script: []

variables:
  GRADLE_BUILD_LAUNCHER_TAG: "2.6.2"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - prepare
  - test
  - build

.gradle_image:
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]

.artifactory_credentials:
  extends: .artifactory_service_create_token_no_depends_bash
  before_script:
    - !reference [.artifactory_service_create_token_no_depends_bash, before_script]
    - export ARTIFACTORY_USER="$GITLAB_USER_EMAIL" ARTIFACTORY_PASSWORD="$CI_JOB_ARTIFACTORY_TOKEN"

fetch_sdk:
  stage: prepare
  image: python:3.12-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - python -B -m unittest discover -s ci -p 'test_*.py'
    - python ci/fetch_sdk.py
  artifacts:
    expire_in: 1 day
    paths:
      - build/sdk-source.tar

validate:
  extends: [.gradle_image, .artifactory_credentials]
  stage: test
  interruptible: true
  needs:
    - job: fetch_sdk
      artifacts: true
  script:
    - mkdir -p build/sdk-source app/libs
    - tar -xf build/sdk-source.tar -C build/sdk-source
    - test -s build/sdk-source/LICENSE
    - chmod +x build/sdk-source/gradlew gradlew
    - cd build/sdk-source && ./gradlew --no-daemon --console=plain assembleDebug assembleRelease
    - cd "$CI_PROJECT_DIR"
    - cp build/sdk-source/build/outputs/aar/weartak-plugin-sdk-debug.aar app/libs/weartak-plugin-sdk-debug.aar
    - cp build/sdk-source/build/outputs/aar/weartak-plugin-sdk-release.aar app/libs/weartak-plugin-sdk-release.aar
    - ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest :app:lintDebug :app:packageDebugArtifact :app:compileReleaseKotlin :app:processReleaseMainManifest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/outputs/nearbydrop/debug/*.apk
      - app/build/reports/lint-results-debug.*
    reports:
      junit:
        - protocol/build/test-results/test/*.xml
        - app/build/test-results/testDebugUnitTest/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.release_build:
  extends: [.gradle_image, .artifactory_credentials]
  stage: build
  before_script:
    - !reference [.artifactory_credentials, before_script]
    - chmod +x gradlew
    - |
      for var in WEARTAK_RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
        [ -n "$(printenv "$var")" ] || { echo "ERROR: Missing protected signing variable $var"; exit 1; }
      done
    - printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/app/weartak.keystore"
    - chmod 600 "$CI_PROJECT_DIR/app/weartak.keystore"
    - |
      cat > signing.properties <<EOF
      RELEASE_KEYSTORE_FILE=app/weartak.keystore
      RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
      RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
      RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
      EOF
    - chmod 600 signing.properties
    - keytool -list -keystore app/weartak.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
    - echo "Production signing credentials verified."
  needs:
    - job: fetch_sdk
      artifacts: true
    - job: validate
      artifacts: false
  script:
    - mkdir -p build/sdk-source app/libs
    - tar -xf build/sdk-source.tar -C build/sdk-source
    - test -s build/sdk-source/LICENSE
    - chmod +x build/sdk-source/gradlew
    - cd build/sdk-source && ./gradlew --no-daemon --console=plain assembleDebug assembleRelease
    - cd "$CI_PROJECT_DIR"
    - cp build/sdk-source/build/outputs/aar/weartak-plugin-sdk-debug.aar app/libs/weartak-plugin-sdk-debug.aar
    - cp build/sdk-source/build/outputs/aar/weartak-plugin-sdk-release.aar app/libs/weartak-plugin-sdk-release.aar
    - chmod +x gradlew
    - ./gradlew --no-daemon clean :app:packageReleaseArtifact
    - |
      set -eu
      APK="$(find app/build/outputs/nearbydrop/release -type f -name '*.apk' | head -1)"
      [ -n "$APK" ] || { echo "ERROR: No packaged release APK"; exit 1; }
      SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk-linux}}"
      APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
      [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || { echo "ERROR: apksigner missing"; exit 1; }
      EXPECTED="1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d"
      "$APKSIGNER" verify "$APK" || { echo "ERROR: APK signature verification failed."; exit 1; }
      ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
      echo "APK: $APK"
      echo "Expected TPC plugin signer: $EXPECTED"
      echo "Actual signer:   $ACTUAL"
      [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: Unexpected signing certificate"; exit 1; }
      echo "Production signing verified."
      sha256sum "$APK" > "$APK.sha256"
  after_script:
    - rm -f app/weartak.keystore signing.properties

main_release:
  extends: .release_build
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/nearbydrop/release/*.apk
      - app/build/outputs/nearbydrop/release/*.apk.sha256
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

official_release:
  extends: .release_build
  artifacts:
    when: always
    expire_in: never
    paths:
      - app/build/outputs/nearbydrop/release/*.apk
      - app/build/outputs/nearbydrop/release/*.apk.sha256
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
